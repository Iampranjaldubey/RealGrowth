services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REALGROWTH_ENVIRONMENT: production
      # Restrict this to your real frontend origin(s) in any shared deployment;
      # "*" is fine for a solo local run but was the production default in the
      # previous config, which is what this project fixes.
      REALGROWTH_CORS_ORIGINS: "*"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/meta/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The nginx config proxies /api/ to the backend service, so the SPA
        # can always call a same-origin relative path.
        VITE_API_URL: /api
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
