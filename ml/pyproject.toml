[project]
name = "realgrowth-ml"
version = "1.0.0"
description = "RealGrowth modelling: inflation forecasting and imputation-artefact detection"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==2.3.4",
    "pandas==2.3.3",
    "scipy==1.18.1",
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib==3.10.7",
    "nbformat==5.10.4",
    "nbconvert==7.16.6",
    "ipykernel==7.1.0",
]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning:lightgbm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Notebook cell sources are embedded as strings; wrapping them hurts readability.
"scripts/build_notebooks.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["realgrowth_ml"]
