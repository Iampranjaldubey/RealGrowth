{% extends "base.html" %}

{% block title %}Economic Growth{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Real Economic Growth</h2>
    <p>Explore real economic growth rates across different countries over time.</p>
</div>

<div class="card">
    <div class="controls">
        <div class="form-group">
            <label for="countrySelect">Select Country</label>
            <select id="countrySelect">
                <option value="">-- Select a Country --</option>
            </select>
        </div>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="loading" class="loading">Loading data...</div>

    <div class="chart-container">
        <canvas id="growthChart"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/growth.js') }}"></script>
{% endblock %}
