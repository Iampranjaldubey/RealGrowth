{% extends "base.html" %}

{% block title %}Food Prices{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Food Price Comparison</h2>
    <p>Compare the cost of a healthy diet across different countries.</p>
</div>

<div class="card">
    <div class="chart-tabs">
        <button class="tab-button active" data-tab="histogram-tab">Bar Comparison</button>
        <button class="tab-button" data-tab="line-tab">Trend Line</button>
    </div>

    <!-- Histogram Tab -->
    <div id="histogram-tab" class="tab-content active">
        <div class="controls">
            <div class="form-group">
                <label for="country1">Country 1</label>
                <select id="country1"></select>
            </div>
            <div class="form-group">
                <label for="country2">Country 2</label>
                <select id="country2"></select>
            </div>
            <button id="histogramBtn" type="button">Generate Chart</button>
        </div>
        <div class="chart-container">
            <canvas id="histogramChart"></canvas>
        </div>
    </div>

    <!-- Line Tab -->
    <div id="line-tab" class="tab-content">
        <div class="controls">
            <div class="form-group">
                <label for="country1_line">Country 1</label>
                <select id="country1_line"></select>
            </div>
            <div class="form-group">
                <label for="country2_line">Country 2</label>
                <select id="country2_line"></select>
            </div>
            <button id="lineBtn" type="button">Generate Chart</button>
        </div>
        <div class="chart-container">
            <canvas id="lineChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/food.js') }}"></script>
{% endblock %}
