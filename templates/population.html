{% extends "base.html" %}

{% block title %}Population{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Population Data</h2>
    <p>Compare urban and rural population distributions and trends over time.</p>
</div>

<div class="card">
    <div class="chart-tabs">
        <button class="tab-button active" data-tab="pie-section">Distribution</button>
        <button class="tab-button" data-tab="line-section">Trends</button>
    </div>

    <!-- Pie Chart Tab -->
    <div id="pie-section" class="tab-content active">
        <div class="controls">
            <div class="form-group">
                <label for="countryPie">Country</label>
                <select id="countryPie"></select>
            </div>
            <div class="form-group">
                <label for="yearSelect">Year</label>
                <select id="yearSelect"></select>
            </div>
            <button id="pieBtn" type="button">Show Distribution</button>
        </div>
        <div class="chart-container">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <!-- Line Charts Tab -->
    <div id="line-section" class="tab-content">
        <div class="controls">
            <div class="form-group">
                <label for="countryLine">Country</label>
                <select id="countryLine"></select>
            </div>
            <button id="trendBtn" type="button">Show Trends</button>
        </div>
        <div class="chart-container">
            <h3 style="margin-bottom:0.5rem;font-size:1rem;color:#6b7280">Rural Population</h3>
            <canvas id="ruralLineChart"></canvas>
        </div>
        <div class="chart-container" style="margin-top:2rem">
            <h3 style="margin-bottom:0.5rem;font-size:1rem;color:#6b7280">Urban Population</h3>
            <canvas id="urbanLineChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/population.js') }}"></script>
{% endblock %}
