name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest --cov=realgrowth --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  ml:
    name: ML (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts && ruff format --check src tests

      - name: Test (pytest)
        # Leakage, backtest-split, conformal-coverage, SHAP and label-recovery
        # tests run on synthetic panels, so this job needs no warehouse.
        run: pytest
        env:
          PYTHONPATH: src:../backend/src

  etl-strict:
    name: ETL (strict data-quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify snapshot checksums
        run: python -m realgrowth.ingest --verify
        env:
          PYTHONPATH: backend/src

      - name: Build warehouse in strict mode
        # Stdlib only: no pip install. --strict fails on an unresolved country,
        # a duplicate country-year or a missing snapshot file, so a silent data
        # regression blocks CI instead of shipping.
        run: |
          python -m realgrowth.etl \
            --raw-dir data/raw \
            --reference data/reference/countries.csv \
            --models data/models \
            --output /tmp/realgrowth.db \
            --report /tmp/quality-report.json \
            --strict
        env:
          PYTHONPATH: backend/src

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: /tmp/quality-report.json

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm install` rather than `npm ci` so the platform-specific native
        # bundler binary (rolldown) resolves for the runner; versions are still
        # pinned by the committed package-lock.json.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
